<!DOCTYPE html>
<html><head><title>init</title></head>
<body>
<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"></script>
<script>
try {
  var sm = Vue.ref({
    show: false,
    lastLevel: null,
    answers: [null,null,null,null],
    get totalScore() { return this.answers.reduce((s,v)=>s+(v??0),0); },
    get allAnswered() { return this.answers.every(v=>v!==null); },
    get lastLevel() { return this.allAnswered ? "LEVEL_X" : null; }
  });
  var before = sm.value.lastLevel;
  sm.value.lastLevel = "manually-set";
  var after = sm.value.lastLevel;
  document.title = "before=" + before + " after=" + after;
} catch (e) {
  document.title = "EXCEPTION: " + e.message;
}
</script>
</body></html>
